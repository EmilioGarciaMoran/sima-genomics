# Entorno fijado para el pipeline mtDNA reproducible
# micromamba create -f environment.yml && micromamba activate mtphylo
name: mtphylo
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - mafft=7.526
  - iqtree=3.0.1
  - raxml-ng=1.2.2
  - biopython=1.84
  - matplotlib-base=3.9
  - reportlab=4.2
